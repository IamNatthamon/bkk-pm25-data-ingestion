[project]
name = "bkk-pm25-pipeline"
version = "1.0.0"
description = "Bangkok PM2.5 forecasting data pipeline - Bronze/Silver/Gold ETL"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=23.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "xarray>=2024.0.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.0.0",
    "syrupy>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ml = [
    "torch>=2.0.0",
    "shap>=0.50.0",
    "optuna>=4.0.0",
    "mlflow>=2.0.0",
    "scipy>=1.13.0",
]
monitoring = [
    "evidently>=0.4.0",
    "ydata-profiling>=4.0.0",
    "streamlit>=1.35.0",
]
orchestration = [
    "prefect>=3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
